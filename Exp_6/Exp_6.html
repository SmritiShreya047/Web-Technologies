<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Form Section -->
    <div class="form-section">
      <div class="form-header">
        <h2>Registration form</h2>
        <p>Please fill in your details below</p>
      </div>
      
      <form id="myForm"> 
        <div class="form-row">
          <div class="form-group">
            <label>FULL NAME <span>*</span></label>
            <input type="text" id="name" placeholder="John Smith" required/>
          </div>
          
          <div class="form-group">
            <label>EMAIL <span>*</span></label>
            <input type="email" id="email" placeholder="john@company.com" required />
          </div>
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label>PASSWORD <span>*</span></label>
            <input type="password" id="password" placeholder="Minimum 8 characters" required />
          </div>
          
          <div class="form-group">
            <label>DATE OF BIRTH</label>
            <input type="date" id="dob" />
          </div>
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label>COUNTRY</label>
            <select id="country">
              <option value="USA">United States</option>
              <option value="Canada">Canada</option>
              <option value="UK">United Kingdom</option>
              <option value="Australia">Australia</option>
              <option value="Germany">Germany</option>
              <option value="France">France</option>
              <option value="India">India</option>
              <option value="Japan">Japan</option>
              <option value="Korea">South Korea</option>
              <option value="Iceland">Iceland</option>
              <option value="Singapore">Singapore</option>
            </select>
          </div>
          
          <div class="form-group">
            <label>AGE</label>
            <input type="number" id="age" min="1" max="120" placeholder="25">
          </div>
        </div>
        
        <div class="form-row">
          <div class="form-group full-width">
            <label>PHONE NUMBER</label>
            <input type="tel" id="phone" placeholder="+91 98765 43210" value="+91 98765 43210">
          </div>
        </div>
        
        <div class="form-row">
          <div class="form-group full-width">
            <label>ADDRESS</label>
            <textarea id="address" rows="2" placeholder="Street address, city, postal code"></textarea>
          </div>
        </div>
        
        <div class="form-row">
          <div class="form-group full-width">
            <label>GENDER</label>
            <div class="radio-group">
              <div class="radio-options">
                <label class="radio-label">
                  <input type="radio" name="Gender" id="female" value="Female"> Female
                </label>
                <label class="radio-label">
                  <input type="radio" name="Gender" id="male" value="Male"> Male
                </label>
              </div>
            </div>
          </div>
        </div>
        
        <div class="form-row">
          <div class="form-group full-width">
            <div class="checkbox-group">
              <label class="checkbox-label">
                <input type="checkbox" id="agree" value="Agreed"/> 
                I agree to the terms and conditions
              </label>
            </div>
          </div>
        </div>
        
        <div class="button-group">
          <button type="button" class="btn btn-primary" onclick="printFormData()">Print form data</button>
          <button type="reset" class="btn btn-secondary">Reset</button>
        </div>
      </form>
    </div>

    <!-- Print Section -->
    <div class="print-section" id="printArea">
      <div class="print-header">
        <h3>Form data preview</h3>
        <span>Live</span>
      </div>
      <div id="output" class="output-content">
        <div class="empty-state">
          Fill out the form and click "Print form data" to see your information here
        </div>
      </div>
    </div>
  </div>

  <script>
    function printFormData() {
      // Get form values
      const name = document.getElementById("name").value || "Not provided";
      const email = document.getElementById("email").value || "Not provided";
      const password = document.getElementById("password").value ? "••••••••" : "Not provided";
      const dob = document.getElementById("dob").value || "Not provided";
      const country = document.getElementById("country").value;
      const address = document.getElementById("address").value || "Not provided";
      const age = document.getElementById("age").value || "Not provided";
      const phone = document.getElementById("phone").value || "+91 98765 43210";
      
      // Get gender
      let gender = "Not provided";
      if (document.getElementById("female").checked) gender = "Female";
      else if (document.getElementById("male").checked) gender = "Male";
      
      // Get terms agreement
      const termsAgreed = document.getElementById("agree").checked ? "Yes" : "No";
      
      // Format date if provided
      const formattedDob = dob !== "Not provided" ? new Date(dob).toLocaleDateString('en-US', {
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      }) : "Not provided";
      
      // Create output HTML
      const output = `
        <div class="output-row">
          <div class="output-label">Name</div>
          <div class="output-value">${name}</div>
        </div>
        <div class="output-row">
          <div class="output-label">Email</div>
          <div class="output-value">${email}</div>
        </div>
        <div class="output-row">
          <div class="output-label">Password</div>
          <div class="output-value">${password}</div>
        </div>
        <div class="output-row">
          <div class="output-label">Birth date</div>
          <div class="output-value">${formattedDob}</div>
        </div>
        <div class="output-row">
          <div class="output-label">Country</div>
          <div class="output-value">${country}</div>
        </div>
        <div class="output-row">
          <div class="output-label">Age</div>
          <div class="output-value">${age}</div>
        </div>
        <div class="output-row">
          <div class="output-label">Phone</div>
          <div class="output-value">${phone}</div>
        </div>
        <div class="output-row">
          <div class="output-label">Address</div>
          <div class="output-value">${address}</div>
        </div>
        <div class="output-row">
          <div class="output-label">Gender</div>
          <div class="output-value">${gender}</div>
        </div>
        <div class="output-row">
          <div class="output-label">Terms</div>
          <div class="output-value">${termsAgreed}</div>
        </div>
      `;
      
      // Update output
      document.getElementById("output").innerHTML = output;
    }

    // Optional: Set default country to India
    document.addEventListener('DOMContentLoaded', function() {
      // You can uncomment the line below if you want India as default selected country
      // document.getElementById('country').value = 'India';
    });
  </script>
</body>
</html>
